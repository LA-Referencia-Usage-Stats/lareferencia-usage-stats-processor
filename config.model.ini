[GENERAL]
ACTIONS = views, outlinks, downloads, conversions
ACTIONS_ID = 1,2,3,-1
LOGS_BUCKET = lareferencia-stats-logs

[LABELS]
COUNTRY = country
STATS_BY_COUNTRY = stats_by_country
OAI_IDENTIFIER = oai_identifier
ACTION_TYPE = action_type
ID_VISIT = idvisit

[ROBOTS_FILTER]
QUERY_STR = visit_total_actions <= 10 or (visit_total_actions > 10 and visit_total_actions < 100 and avg_action_time > 2)

[ASSETS_FILTER]
REGEX = ^.\.[a-z]{3}\.(jpg|png)$|^\.jpeg\.(jpg|png)$

[OUTPUT]
ELASTIC_URL = https://elk.lareferencia.info
INDEX_PREFIX = test-robot-filter

[USAGE_STATS_DB]
HOST = usage-db
PORT = 3306
USERNAME = stats
PASSWORD = stats
DATABASE = lareferencia_usage_stats

[MATOMO_DB]
HOST = server
PORT = 3306
USERNAME = us
PASSWORD = passsword
DATABASE = matomo

[S3_STATS]
VISITS_PATH = lareferencia-stats/v2/visits
EVENTS_PATH = lareferencia-stats/v2/events

[S3_LOGS]
LOGS_PATH = lareferencia-stats/v2/logs

[PROCESSING]
# Number of rows to process per chunk when streaming from MySQL
# Larger values = faster but more memory usage
# Smaller values = slower but less memory usage
CHUNK_SIZE = 100000
